<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bexa SMM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E17;
    --surface: #141A28;
    --surface-2: #1B2233;
    --border: #262E44;
    --accent: #7C5CFF;
    --accent-2: #37E8B0;
    --warn: #FFB020;
    --danger: #FF5C77;
    --text: #EDEFF7;
    --muted: #8890A6;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  h1, h2, h3, .display { font-family: 'Sora', sans-serif; }
  #app { min-height: 100vh; padding-bottom: 88px; }

  /* Header */
  .header {
    padding: 20px 18px 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: radial-gradient(120% 140% at 0% 0%, rgba(124,92,255,0.25), transparent 60%);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
  }
  .brand-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; }
  .brand-sub { font-size: 12px; color: var(--muted); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }

  .container { padding: 0 18px; }

  /* Tabs content */
  .view { display: none; animation: fadeIn .25s ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Service grid */
  .section-title {
    font-size: 15px; font-weight: 700; margin: 18px 0 12px; color: var(--text);
  }
  .service-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .service-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .service-card:active { transform: scale(0.97); border-color: var(--accent); }
  .service-icon { font-size: 26px; margin-bottom: 10px; }
  .service-title { font-weight: 600; font-size: 14px; line-height: 1.3; }

  /* Form */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .field-label {
    font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .chip {
    padding: 9px 14px; border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--border); font-size: 13px; color: var(--text);
    cursor: pointer; transition: all .12s ease;
  }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  input[type=text], input[type=number], textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 14px;
    font-family: 'Inter', sans-serif; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }

  .price-box {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 6px 0 10px;
  }
  .price-label { font-size: 13px; color: var(--muted); }
  .price-value { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 22px; color: var(--accent-2); }
  .boost-meter {
    height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-bottom: 4px;
  }
  .boost-meter-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .3s ease;
    box-shadow: 0 0 12px rgba(55,232,176,0.5);
  }

  .btn {
    display: block; width: 100%; text-align: center;
    padding: 14px; border-radius: 14px; border: none;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px;
    cursor: pointer;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #9B7CFF); color: #fff; }
  .btn-primary:active { opacity: .85; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(255,92,119,0.15); color: var(--danger); border: 1px solid rgba(255,92,119,0.3); }
  .btn-small { padding: 9px 12px; font-size: 12px; border-radius: 10px; }

  .back-row { display: flex; align-items: center; gap: 10px; margin: 16px 0 6px; }
  .back-btn {
    width: 34px; height: 34px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px;
  }

  /* History */
  .order-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .order-id { font-weight: 700; font-size: 13px; }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
  .badge-pending { background: rgba(255,176,32,0.15); color: var(--warn); }
  .badge-done { background: rgba(55,232,176,0.15); color: var(--accent-2); }
  .badge-rejected { background: rgba(255,92,119,0.15); color: var(--danger); }
  .order-service { font-size: 14px; margin-bottom: 4px; }
  .order-meta { font-size: 12px; color: var(--muted); }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 38px; margin-bottom: 10px; }

  /* Admin */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .stat-value { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .list-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-main { font-size: 13px; }
  .list-sub { font-size: 11px; color: var(--muted); }

  .admin-tabs { display: flex; gap: 8px; margin: 16px 0 4px; overflow-x: auto; }
  .admin-tab {
    white-space: nowrap; padding: 8px 14px; border-radius: 999px; font-size: 12px;
    background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; font-weight: 600;
  }
  .admin-tab.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-row input { flex: 1; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(20,26,40,0.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn {
    flex: 1; text-align: center; padding: 8px 0; cursor: pointer;
    color: var(--muted); font-size: 11px; font-weight: 600;
  }
  .nav-btn .nav-icon { font-size: 20px; display: block; margin-bottom: 3px; }
  .nav-btn.active { color: var(--accent-2); }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 12px; font-size: 13px; z-index: 999;
    opacity: 0; transition: opacity .2s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div>
        <div class="brand-name">Bexa SMM</div>
        <div class="brand-sub" id="userGreeting">Yuklanmoqda...</div>
      </div>
    </div>
    <div class="avatar" id="avatarInitial">?</div>
  </div>

  <div class="container">

    <!-- ===================== BUYURTMA TAB ===================== -->
    <div class="view" id="view-order">
      <div id="order-step-catalog">
        <div class="section-title">Xizmat turini tanlang</div>
        <div class="service-grid" id="serviceGrid"></div>
      </div>

      <div id="order-step-form" class="hidden">
        <div class="back-row">
          <div class="back-btn" onclick="backToCatalog()">←</div>
          <div class="section-title" style="margin:0" id="formTitle">Xizmat</div>
        </div>

        <div class="card" id="subServiceCard">
          <div class="field-label">Xizmat turi</div>
          <div class="chip-group" id="subServiceChips"></div>
        </div>

        <div class="card" id="qualityCard">
          <div class="field-label">Sifat</div>
          <div class="chip-group">
            <div class="chip" data-quality="Kafolatli" onclick="selectQuality(this)">Kafolatli</div>
            <div class="chip" data-quality="Kafolatsiz" onclick="selectQuality(this)">Kafolatsiz</div>
          </div>
        </div>

        <div class="card" id="amountCard">
          <div class="field-label">Miqdor (sonlarda)</div>
          <input type="number" id="amountInput" placeholder="Masalan: 1000" oninput="updatePrice()">
        </div>

        <div class="card" id="linkCard">
          <div class="field-label">Kanal / guruh / bot / post havolasi (link)</div>
          <input type="text" id="linkInput" placeholder="https://t.me/...">
        </div>

        <div class="card hidden" id="detailsCard">
          <div class="field-label">Tavsif</div>
          <textarea id="detailsInput" placeholder="Botingiz haqida yozing..."></textarea>
        </div>

        <div class="card">
          <div class="price-box">
            <span class="price-label">Umumiy narx</span>
            <span class="price-value" id="priceValue">0 so'm</span>
          </div>
          <div class="boost-meter"><div class="boost-meter-fill" id="boostFill"></div></div>
        </div>

        <button class="btn btn-primary" onclick="submitOrder()">Buyurtma berish</button>
      </div>
    </div>

    <!-- ===================== TARIX TAB ===================== -->
    <div class="view" id="view-history">
      <div class="section-title">Mening buyurtmalarim</div>
      <div id="historyList"></div>
    </div>

    <!-- ===================== ADMIN TAB ===================== -->
    <div class="view" id="view-admin">
      <div class="admin-tabs">
        <div class="admin-tab selected" data-panel="stats" onclick="selectAdminTab(this)">📊 Statistika</div>
        <div class="admin-tab" data-panel="users" onclick="selectAdminTab(this)">👥 Foydalanuvchilar</div>
        <div class="admin-tab" data-panel="admins" onclick="selectAdminTab(this)">🛡 Adminlar</div>
        <div class="admin-tab" data-panel="channels" onclick="selectAdminTab(this)">📢 Majburiy kanallar</div>
      </div>

      <div class="admin-panel active" id="panel-stats">
        <div class="stat-grid" id="statsGrid"></div>
      </div>

      <div class="admin-panel" id="panel-users">
        <div class="card" id="usersList"></div>
      </div>

      <div class="admin-panel" id="panel-admins">
        <div class="card">
          <div id="adminsList"></div>
          <div class="add-row">
            <input type="text" id="newAdminId" placeholder="Telegram ID">
            <button class="btn btn-primary btn-small" style="width:auto" onclick="addAdmin()">Qo'shish</button>
          </div>
        </div>
      </div>

      <div class="admin-panel" id="panel-channels">
        <div class="card">
          <div id="channelsList"></div>
          <div class="add-row">
            <input type="text" id="newChannel" placeholder="@kanal_nomi">
            <button class="btn btn-primary btn-small" style="width:auto" onclick="addChannel()">Qo'shish</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="bottom-nav" id="bottomNav">
  <div class="nav-btn active" data-tab="order" onclick="switchTab('order')">
    <span class="nav-icon">🛒</span>Buyurtma
  </div>
  <div class="nav-btn" data-tab="history" onclick="switchTab('history')">
    <span class="nav-icon">📦</span>Tarix
  </div>
  <div class="nav-btn hidden" id="navAdmin" data-tab="admin" onclick="switchTab('admin')">
    <span class="nav-icon">🛠</span>Admin
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || "";
let SERVICES = {};
let ME = null;
let currentCategory = null;
let selectedSubService = null;
let selectedQuality = null;

function api(path, options = {}) {
  options.headers = options.headers || {};
  options.headers["X-Telegram-Init-Data"] = initData;
  if (options.body) options.headers["Content-Type"] = "application/json";
  return fetch(path, options).then(async r => {
    if (!r.ok) {
      const err = await r.json().catch(() => ({detail: "Xatolik"}));
      throw new Error(err.detail || "Xatolik");
    }
    return r.json();
  });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function switchTab(tab) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + tab).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add("active");
  if (tab === "history") loadHistory();
  if (tab === "admin") loadAdminStats();
}

// ---------------- INIT ----------------
async function init() {
  try {
    ME = await api("/api/me");
    document.getElementById("userGreeting").textContent = ME.full_name || ("@" + (ME.username || "mehmon"));
    document.getElementById("avatarInitial").textContent = (ME.full_name || "?").charAt(0).toUpperCase();
    if (ME.is_admin) {
      document.getElementById("navAdmin").classList.remove("hidden");
    }
  } catch (e) {
    document.getElementById("userGreeting").textContent = "Xush kelibsiz";
  }

  SERVICES = await api("/api/services");
  renderCatalog();

  const params = new URLSearchParams(window.location.search);
  const tab = params.get("tab");
  if (tab === "history") switchTab("history");
  if (tab === "admin" && ME && ME.is_admin) switchTab("admin");
}

// ---------------- BUYURTMA ----------------
function renderCatalog() {
  const grid = document.getElementById("serviceGrid");
  grid.innerHTML = "";
  for (const [key, cat] of Object.entries(SERVICES)) {
    const el = document.createElement("div");
    el.className = "service-card";
    el.onclick = () => openService(key);
    el.innerHTML = `<div class="service-icon">${cat.icon}</div><div class="service-title">${cat.title}</div>`;
    grid.appendChild(el);
  }
}

function openService(key) {
  currentCategory = key;
  selectedSubService = null;
  selectedQuality = null;
  const cat = SERVICES[key];

  document.getElementById("order-step-catalog").classList.add("hidden");
  document.getElementById("order-step-form").classList.remove("hidden");
  document.getElementById("formTitle").textContent = cat.title;

  document.getElementById("subServiceCard").classList.toggle("hidden", !!cat.fixed);
  document.getElementById("qualityCard").classList.toggle("hidden", !!cat.fixed);
  document.getElementById("amountCard").classList.toggle("hidden", !!cat.fixed);
  document.getElementById("linkCard").classList.toggle("hidden", !!cat.fixed);
  document.getElementById("detailsCard").classList.toggle("hidden", !cat.needs_details);

  if (!cat.fixed) {
    const chipsBox = document.getElementById("subServiceChips");
    chipsBox.innerHTML = "";
    cat.sub_services.forEach(s => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = s;
      chip.onclick = () => {
        document.querySelectorAll("#subServiceChips .chip").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
        selectedSubService = s;
      };
      chipsBox.appendChild(chip);
    });
  }

  document.getElementById("amountInput").value = "";
  document.getElementById("linkInput").value = "";
  document.getElementById("detailsInput").value = "";
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
  updatePrice();
}

function selectQuality(el) {
  document.querySelectorAll('[data-quality]').forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  selectedQuality = el.dataset.quality;
}

function backToCatalog() {
  document.getElementById("order-step-form").classList.add("hidden");
  document.getElementById("order-step-catalog").classList.remove("hidden");
}

function updatePrice() {
  const cat = SERVICES[currentCategory];
  if (!cat) return;
  let price = 0;
  if (cat.fixed) {
    price = cat.price;
  } else {
    const unitPrices = {"Telegram nakrutka": 50, "Instagram": 40, "TikTok": 35, "YouTube": 60};
    const amount = parseInt(document.getElementById("amountInput").value) || 0;
    price = (unitPrices[cat.price_key] || 0) * amount;
  }
  document.getElementById("priceValue").textContent = formatPrice(price);
  const amount = parseInt(document.getElementById("amountInput")?.value) || 0;
  const pct = Math.min(100, (amount / 5000) * 100);
  document.getElementById("boostFill").style.width = pct + "%";
}

function formatPrice(n) {
  return n.toLocaleString("ru-RU").replace(/,/g, " ") + " so'm";
}

async function submitOrder() {
  const cat = SERVICES[currentCategory];
  const payload = { category: currentCategory };

  if (!cat.fixed) {
    if (!selectedSubService) { showToast("Xizmat turini tanlang"); return; }
    const amount = document.getElementById("amountInput").value;
    if (!amount) { showToast("Miqdorni kiriting"); return; }
    payload.sub_service = selectedSubService;
    payload.quality = selectedQuality;
    payload.amount = amount;
    payload.link = document.getElementById("linkInput").value;
  }
  if (cat.needs_details) {
    payload.details = document.getElementById("detailsInput").value;
  }

  try {
    const res = await api("/api/order", { method: "POST", body: JSON.stringify(payload) });
    tg.HapticFeedback?.notificationOccurred("success");
    showToast(`✅ Buyurtma qabul qilindi! #${res.order_id}`);
    backToCatalog();
    setTimeout(() => switchTab("history"), 600);
  } catch (e) {
    showToast("❌ Xatolik: " + e.message);
  }
}

// ---------------- TARIX ----------------
async function loadHistory() {
  const box = document.getElementById("historyList");
  box.innerHTML = `<div class="empty-state">Yuklanmoqda...</div>`;
  try {
    const orders = await api("/api/orders/history");
    if (!orders.length) {
      box.innerHTML = `<div class="empty-state"><div class="emoji">📭</div>Hali buyurtmalar yo'q</div>`;
      return;
    }
    box.innerHTML = "";
    orders.forEach(o => {
      const badge = o.status === "done" ? '<span class="badge badge-done">✅ Bajarildi</span>'
                  : o.status === "rejected" ? '<span class="badge badge-rejected">❌ Rad etildi</span>'
                  : '<span class="badge badge-pending">⏳ Kutilmoqda</span>';
      const el = document.createElement("div");
      el.className = "order-item";
      el.innerHTML = `
        <div class="order-top"><span class="order-id">#${o.id}</span>${badge}</div>
        <div class="order-service">${o.service || "-"}</div>
        <div class="order-meta">${o.amount ? "Miqdor: " + o.amount + " · " : ""}${o.price ? formatPrice(o.price) : ""}</div>
        ${o.reject_reason ? `<div class="order-meta" style="color:var(--danger);margin-top:4px;">Sabab: ${o.reject_reason}</div>` : ""}
      `;
      box.appendChild(el);
    });
  } catch (e) {
    box.innerHTML = `<div class="empty-state">Xatolik: ${e.message}</div>`;
  }
}

// ---------------- ADMIN ----------------
function selectAdminTab(el) {
  document.querySelectorAll(".admin-tab").forEach(t => t.classList.remove("selected"));
  el.classList.add("selected");
  document.querySelectorAll(".admin-panel").forEach(p => p.classList.remove("active"));
  const panel = el.dataset.panel;
  document.getElementById("panel-" + panel).classList.add("active");
  if (panel === "stats") loadAdminStats();
  if (panel === "users") loadAdminUsers();
  if (panel === "admins") loadAdminAdmins();
  if (panel === "channels") loadAdminChannels();
}

async function loadAdminStats() {
  try {
    const s = await api("/api/admin/stats");
    const grid = document.getElementById("statsGrid");
    grid.innerHTML = `
      <div class="stat-card"><div class="stat-value">${s.total_users}</div><div class="stat-label">Foydalanuvchilar</div></div>
      <div class="stat-card"><div class="stat-value">${s.total_orders}</div><div class="stat-label">Jami buyurtmalar</div></div>
      <div class="stat-card"><div class="stat-value">${s.done_orders}</div><div class="stat-label">Bajarilgan</div></div>
      <div class="stat-card"><div class="stat-value">${s.pending_orders}</div><div class="stat-label">Kutilmoqda</div></div>
      <div class="stat-card"><div class="stat-value">${s.rejected_orders}</div><div class="stat-label">Rad etilgan</div></div>
      <div class="stat-card"><div class="stat-value">${formatPrice(s.total_income)}</div><div class="stat-label">Jami tushum</div></div>
    `;
  } catch (e) { showToast(e.message); }
}

async function loadAdminUsers() {
  const box = document.getElementById("usersList");
  box.innerHTML = "Yuklanmoqda...";
  try {
    const users = await api("/api/admin/users");
    if (!users.length) { box.innerHTML = `<div class="empty-state">Foydalanuvchilar yo'q</div>`; return; }
    box.innerHTML = "";
    users.forEach(u => {
      const row = document.createElement("div");
      row.className = "list-row";
      row.innerHTML = `
        <div>
          <div class="list-main">${u.full_name || "Noma'lum"} ${u.username ? "(@" + u.username + ")" : ""}</div>
          <div class="list-sub">ID: ${u.user_id} · Tel: ${u.phone || "-"} · ${u.orders_count} buyurtma</div>
        </div>`;
      box.appendChild(row);
    });
  } catch (e) { box.innerHTML = "Xatolik: " + e.message; }
}

async function loadAdminAdmins() {
  const box = document.getElementById("adminsList");
  box.innerHTML = "Yuklanmoqda...";
  try {
    const admins = await api("/api/admin/admins");
    box.innerHTML = "";
    admins.forEach(a => {
      const row = document.createElement("div");
      row.className = "list-row";
      row.innerHTML = `
        <div>
          <div class="list-main">${a.username || "ID: " + a.user_id}</div>
          <div class="list-sub">ID: ${a.user_id}</div>
        </div>
        <button class="btn btn-danger btn-small" style="width:auto" onclick="removeAdmin(${a.user_id})">O'chirish</button>
      `;
      box.appendChild(row);
    });
  } catch (e) { box.innerHTML = "Xatolik: " + e.message; }
}

async function addAdmin() {
  const val = document.getElementById("newAdminId").value.trim();
  if (!val) return;
  try {
    await api("/api/admin/admins/add", { method: "POST", body: JSON.stringify({ user_id: parseInt(val) }) });
    document.getElementById("newAdminId").value = "";
    showToast("✅ Admin qo'shildi");
    loadAdminAdmins();
  } catch (e) { showToast("Xatolik: " + e.message); }
}

async function removeAdmin(id) {
  try {
    await api("/api/admin/admins/remove", { method: "POST", body: JSON.stringify({ user_id: id }) });
    showToast("O'chirildi");
    loadAdminAdmins();
  } catch (e) { showToast("Xatolik: " + e.message); }
}
